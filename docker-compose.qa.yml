services:
  frontend:
    build:
      context: ./frontend
    container_name: vaporlab_frontend_qa
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:28080
      - NEXT_PUBLIC_OPERATOR_ACCESS_KEY=vaporlab-ops
    ports:
      - "25100:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api

  api:
    build: .
    container_name: vaporlab_api_qa
    environment:
      - SECURE_MODE=false
      - HARDENING_ENABLED=true
      - JWT_SECRET=weaksecret
      - AI_API_KEY=hardcoded-demo-ai-key
    ports:
      - "28080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null && wget -qO- http://localhost:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: vaporlab_postgres_qa
    environment:
      - POSTGRES_USER=vapor
      - POSTGRES_PASSWORD=vapor
      - POSTGRES_DB=vaporlab
    ports:
      - "25432:5432"

  redis:
    image: redis:7
    container_name: vaporlab_redis_qa
    ports:
      - "26379:6379"

  minio:
    image: minio/minio:latest
    container_name: vaporlab_minio_qa
    command: server /data --console-address ":9001"
    ports:
      - "29000:9000"
      - "29001:9001"

  vectordb:
    image: qdrant/qdrant:latest
    container_name: vaporlab_qdrant_qa
    ports:
      - "26333:6333"

  prometheus:
    image: prom/prometheus:latest
    container_name: vaporlab_prometheus_qa
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "29090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: vaporlab_grafana_qa
    ports:
      - "23000:3000"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vaporlab_jaeger_qa
    ports:
      - "26687:16686"

  gateway:
    image: nginx:alpine
    container_name: vaporlab_gateway_qa
    ports:
      - "28081:80"
