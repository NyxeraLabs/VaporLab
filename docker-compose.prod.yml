services:
  frontend:
    build:
      context: ./frontend
    container_name: vaporlab_frontend_prod
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:38080
      - NEXT_PUBLIC_OPERATOR_ACCESS_KEY=vaporlab-ops
      - NODE_ENV=production
    ports:
      - "35100:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):3000/api/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: .
    container_name: vaporlab_api_prod
    environment:
      - SECURE_MODE=true
      - HARDENING_ENABLED=true
      - JWT_SECRET=replace-in-prod
      - AI_API_KEY=replace-in-prod
    ports:
      - "38080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null && wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: vaporlab_postgres_prod
    environment:
      - POSTGRES_USER=vapor
      - POSTGRES_PASSWORD=vapor
      - POSTGRES_DB=vaporlab
    ports:
      - "35432:5432"

  redis:
    image: redis:7
    container_name: vaporlab_redis_prod
    ports:
      - "36379:6379"

  minio:
    image: minio/minio:latest
    container_name: vaporlab_minio_prod
    command: server /data --console-address ":9001"
    ports:
      - "39000:9000"
      - "39001:9001"

  vectordb:
    image: qdrant/qdrant:latest
    container_name: vaporlab_qdrant_prod
    ports:
      - "36333:6333"

  prometheus:
    image: prom/prometheus:latest
    container_name: vaporlab_prometheus_prod
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "39090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: vaporlab_grafana_prod
    ports:
      - "33000:3000"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vaporlab_jaeger_prod
    ports:
      - "36687:16686"

  gateway:
    image: nginx:alpine
    container_name: vaporlab_gateway_prod
    ports:
      - "38081:80"
