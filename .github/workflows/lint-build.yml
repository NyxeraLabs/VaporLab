name: Lint-Build Gate

on:
  pull_request:
    branches:
      - dev
      - QA
      - main
  workflow_dispatch:

jobs:
  lint-built:
    name: Lint and Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint scripts and validate compose files
        shell: bash
        run: |
          set -e

          bash -n scripts/qa_tests.sh

          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }

          compose -f docker-compose.dev.yml config >/dev/null
          compose -f docker-compose.qa.yml config >/dev/null
          compose -f docker-compose.prod.yml config >/dev/null

      - name: Build smoke check (dev)
        shell: bash
        run: |
          set -e

          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }

          compose -f docker-compose.dev.yml build --no-cache
