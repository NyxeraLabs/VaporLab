name: Lint-Build Gate

on:
  pull_request:
    branches:
      - dev
      - QA
      - main
  workflow_dispatch:

jobs:
  lint-built:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Validate project
        shell: bash
        run: |
          set -e
          gofmt -w cmd pkg
          go vet ./...
          go build ./cmd
          bash -n scripts/qa_tests.sh
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.dev.yml config >/dev/null
          compose -f docker-compose.qa.yml config >/dev/null
          compose -f docker-compose.prod.yml config >/dev/null
