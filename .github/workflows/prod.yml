name: Prod CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-built:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Lint and build
        shell: bash
        run: |
          set -e
          gofmt -w cmd pkg
          go vet ./...
          go build ./cmd
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.dev.yml config >/dev/null

  dev-build:
    runs-on: ubuntu-latest
    needs: lint-built
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build dev image
        shell: bash
        run: |
          set -e
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.dev.yml build api

  prod-deploy:
    runs-on: ubuntu-latest
    needs:
      - lint-built
      - dev-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build prod stack
        shell: bash
        run: |
          set -e
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.prod.yml config >/dev/null
          compose -f docker-compose.prod.yml build
      - name: Optional docker push
        shell: bash
        run: |
          set -e
          echo "Docker push disabled by default"
          # docker login -u "${{ secrets.DOCKER_USER }}" -p "${{ secrets.DOCKER_TOKEN }}"
          # docker-compose -f docker-compose.prod.yml push

  auto-tag:
    runs-on: ubuntu-latest
    needs: prod-deploy
    permissions:
      contents: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git user
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump patch tag and push
        shell: bash
        run: |
          set -e
          git fetch --tags --force
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi
          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "invalid latest tag: $latest_tag"
            exit 1
          fi
          next_patch=$((patch + 1))
          new_tag="v${major}.${minor}.${next_patch}"
          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "tag already exists: $new_tag"
            exit 1
          fi
          git tag "$new_tag"
          git push origin "$new_tag"
