name: Prod CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-built:
    name: Lint and Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint and build (dev baseline)
        shell: bash
        run: |
          set -e

          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }

          compose -f docker-compose.dev.yml config >/dev/null
          compose -f docker-compose.dev.yml build

  dev-build:
    name: Dev Build
    runs-on: ubuntu-latest
    needs: lint-built
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dev stack
        shell: bash
        run: |
          set -e

          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }

          compose -f docker-compose.dev.yml config >/dev/null
          compose -f docker-compose.dev.yml build

  prod-deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    needs:
      - lint-built
      - dev-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production stack
        shell: bash
        run: |
          set -e

          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }

          compose -f docker-compose.prod.yml config >/dev/null
          compose -f docker-compose.prod.yml build

      - name: Optional Docker image push (commented)
        shell: bash
        run: |
          set -e
          echo "Docker image push is intentionally disabled."
          # docker login -u "${{ secrets.DOCKER_USER }}" -p "${{ secrets.DOCKER_TOKEN }}"
          # docker-compose -f docker-compose.prod.yml push

  auto-tag:
    name: Auto Increment Patch Tag
    runs-on: ubuntu-latest
    needs: prod-deploy
    permissions:
      contents: write
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push next patch tag
        shell: bash
        run: |
          set -e

          git fetch --tags --force

          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"

          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "Invalid latest tag format: $latest_tag"
            exit 1
          fi

          next_patch=$((patch + 1))
          new_tag="v${major}.${minor}.${next_patch}"

          echo "Latest tag: $latest_tag"
          echo "New tag: $new_tag"

          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "Tag already exists: $new_tag"
            exit 1
          fi

          git tag "$new_tag"
          git push origin "$new_tag"
