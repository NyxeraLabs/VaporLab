name: Dev CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  lint-built:
    name: Lint and Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint and build (dev)
        shell: bash
        run: |
          set -e

          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }

          compose -f docker-compose.dev.yml config >/dev/null
          compose -f docker-compose.dev.yml build

  dev-build:
    name: Dev Build
    runs-on: ubuntu-latest
    needs: lint-built
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dev stack
        shell: bash
        run: |
          set -e

          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }

          compose -f docker-compose.dev.yml config >/dev/null
          compose -f docker-compose.dev.yml build
