name: Dev CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  lint-built:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Lint and build
        shell: bash
        run: |
          set -e
          gofmt -w cmd pkg
          go vet ./...
          go build ./cmd
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.dev.yml config >/dev/null

  dev-build:
    runs-on: ubuntu-latest
    needs: lint-built
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build dev stack
        shell: bash
        run: |
          set -e
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.dev.yml build
