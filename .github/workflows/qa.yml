name: QA CI

on:
  push:
    branches:
      - QA
  workflow_dispatch:

jobs:
  lint-built:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Lint and build
        shell: bash
        run: |
          set -e
          gofmt -w cmd pkg
          go vet ./...
          go build -o /tmp/vaporlab ./cmd
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.qa.yml config >/dev/null

  qa-tests:
    runs-on: ubuntu-latest
    needs: lint-built
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build qa image
        shell: bash
        run: |
          set -e
          compose() {
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              docker compose "$@"
            fi
          }
          compose -f docker-compose.qa.yml build api
      - name: Run QA checks
        shell: bash
        run: |
          set -e
          bash -n scripts/qa_tests.sh
          scripts/update_qa_runbook.sh pass "qa workflow checks completed"
