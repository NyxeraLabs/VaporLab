services:
  frontend:
    build:
      context: ./frontend
    container_name: vaporlab_frontend_dev
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:18080
      - NEXT_PUBLIC_OPERATOR_ACCESS_KEY=vaporlab-ops
    ports:
      - "15100:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api

  api:
    build: .
    container_name: vaporlab_api_dev
    environment:
      - SECURE_MODE=false
      - HARDENING_ENABLED=true
      - JWT_SECRET=weaksecret
      - AI_API_KEY=hardcoded-demo-ai-key
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null && wget -qO- http://localhost:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
      - vectordb

  postgres:
    image: postgres:16
    container_name: vaporlab_postgres_dev
    environment:
      - POSTGRES_USER=vapor
      - POSTGRES_PASSWORD=vapor
      - POSTGRES_DB=vaporlab
    ports:
      - "15432:5432"

  redis:
    image: redis:7
    container_name: vaporlab_redis_dev
    ports:
      - "16379:6379"

  minio:
    image: minio/minio:latest
    container_name: vaporlab_minio_dev
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "19000:9000"
      - "19001:9001"

  vectordb:
    image: qdrant/qdrant:latest
    container_name: vaporlab_qdrant_dev
    ports:
      - "16333:6333"

  prometheus:
    image: prom/prometheus:latest
    container_name: vaporlab_prometheus_dev
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: vaporlab_grafana_dev
    ports:
      - "13000:3000"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vaporlab_jaeger_dev
    ports:
      - "16687:16686"

  gateway:
    image: nginx:alpine
    container_name: vaporlab_gateway_dev
    ports:
      - "18081:80"
