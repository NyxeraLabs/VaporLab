
services:
  api:
    build: .
    container_name: vaporlab_api_dev
    environment:
      - SECURE_MODE=false
      - JWT_SECRET=weaksecret
      - AI_API_KEY=hardcoded-demo-ai-key
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio
      - vectordb

  postgres:
    image: postgres:16
    container_name: vaporlab_postgres_dev
    environment:
      - POSTGRES_USER=vapor
      - POSTGRES_PASSWORD=vapor
      - POSTGRES_DB=vaporlab
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: vaporlab_redis_dev
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: vaporlab_minio_dev
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  vectordb:
    image: qdrant/qdrant:latest
    container_name: vaporlab_qdrant_dev
    ports:
      - "6333:6333"

  prometheus:
    image: prom/prometheus:latest
    container_name: vaporlab_prometheus_dev
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: vaporlab_grafana_dev
    ports:
      - "3000:3000"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vaporlab_jaeger_dev
    ports:
      - "16686:16686"

  gateway:
    image: nginx:alpine
    container_name: vaporlab_gateway_dev
    ports:
      - "8081:80"
